<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f855a" />
  <title>HamHam Keto</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HamHam Keto" />
  <style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #1f2933;
  --muted: #6b7785;
  --line: #e2e8f0;
  --brand: #2f855a;
  --brand-dark: #276749;
  --brand-soft: #e6f4ec;
  --accent: #3182ce;
  --green: #2f855a;
  --green-bg: #e6f4ec;
  --yellow: #b7791f;
  --yellow-bg: #fdf6e3;
  --red: #c53030;
  --red-bg: #fdecec;
  --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
  --radius: 12px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px;
  flex: 0 0 232px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 18px; color: var(--brand-dark);
  padding: 4px 8px 16px;
}
.brand .logo { font-size: 24px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  background: transparent; border: 0; cursor: pointer;
  padding: 10px 12px; border-radius: 9px;
  color: var(--ink); font-size: 15px;
}
.nav button:hover { background: var(--bg); }
.nav button.active { background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; }
.main { max-width: 1040px; margin: 0 auto; padding: 24px 24px 80px; }

/* Kopfleiste */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar .brand { padding: 0; font-size: 19px; }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
.iconbtn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 9px; padding: 7px 12px;
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.iconbtn:hover { background: var(--brand-soft); }
.iconbtn.open { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand-dark); }
.iconbtn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.iconbtn.primary:hover { background: var(--brand-dark); }
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 18px; color: var(--brand-dark);
}
.brand .logo { font-size: 24px; }

h1 { font-size: 26px; margin: 0 0 4px; }
.subtitle { color: var(--muted); margin: 0 0 22px; }

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 18px;
}
.card h3 { margin: 0 0 12px; font-size: 16px; }
.hint { color: var(--muted); font-size: 14px; }
.tip {
  background: var(--brand-soft); color: var(--brand-dark);
  border-radius: 9px; padding: 10px 14px; font-size: 14px; margin-top: 12px;
}

/* Forms */
label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input, select {
  width: 100%; padding: 10px 11px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink);
}
input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.field-note { font-size: 12px; color: var(--muted); margin-top: 3px; }

button.btn {
  background: var(--brand); color: #fff; border: 0; cursor: pointer;
  padding: 10px 16px; border-radius: 9px; font-size: 15px; font-weight: 600;
}
button.btn:hover { background: var(--brand-dark); }
button.btn.secondary { background: #edf2f7; color: var(--ink); }
button.btn.secondary:hover { background: #e2e8f0; }
button.btn.ghost { background: transparent; color: var(--red); padding: 6px 10px; font-weight: 500; }
button.btn.ghost:hover { background: var(--red-bg); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
tr.sum td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: none; }
tr.target td { color: var(--muted); }
td.name { text-align: left; }
td select, td input { padding: 7px 9px; font-size: 14px; }
.tbl-wrap { overflow-x: auto; }
.col-num { width: 92px; }
.col-act { width: 44px; text-align: center !important; }

/* Status badges */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 9px; font-weight: 600; font-size: 15px; margin-top: 14px;
}
.status.ok { background: var(--green-bg); color: var(--green); }
.status.warn { background: var(--yellow-bg); color: var(--yellow); }
.status.bad { background: var(--red-bg); color: var(--red); }
.status.idle { background: #edf2f7; color: var(--muted); }

.ratio-pill { display:inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.ratio-pill.ok { background: var(--green-bg); color: var(--green); }
.ratio-pill.warn { background: var(--yellow-bg); color: var(--yellow); }
.ratio-pill.bad { background: var(--red-bg); color: var(--red); }
.ratio-pill.idle { background: #edf2f7; color: var(--muted); }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--bg); border-radius: 10px; padding: 14px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .l { font-size: 13px; color: var(--muted); }
.stat .u { font-size: 13px; color: var(--muted); font-weight: 400; }

.start-list { font-size: 16px; line-height: 2; }
.start-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

.saved-meal { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.saved-meal .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.saved-meal .title { font-weight: 700; }
.saved-meal .meta { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); font-style: italic; padding: 8px 0; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type=search] { max-width: 280px; }
.toolbar select { max-width: 200px; }

/* Mobile */
.mobile-bar { display: none; }
@media (max-width: 820px) {
  .topbar { padding: 10px 14px; }
  .main { padding: 16px 14px 90px; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 22px; }
  .card { padding: 16px; }
  .overlay { padding: 0; }
  .overlay-card { border-radius: 0; min-height: 100vh; padding: 18px 14px 28px; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { padding: 12px; }
  .tile-icon { font-size: 28px; }
  .tile-name { font-size: 15px; }
}
@media (max-width: 560px) {
  .iconbtn .lbl { display: none; }
  .iconbtn { padding: 7px 10px; font-size: 16px; }
}
@media (max-width: 420px) {
  .tiles { grid-template-columns: 1fr; }
}

.footnote { color: var(--muted); font-size: 13px; margin-top: 24px; }

/* Einstellungen auf der Rezepte-Seite */
.settings-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: end;
  border: 2px solid var(--brand-soft);
}
.settings-grid[hidden] { display: none; }
.seg-field { grid-column: span 2; }

/* Schmale Zusammenfassungs-Zeile */
.summary-bar { margin: 0 0 14px; }
.permeal {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
}
.permeal-main { font-size: 18px; font-weight: 700; color: var(--brand-dark); }
.permeal-main .u { font-size: 13px; font-weight: 400; color: var(--muted); }
.permeal-sub { color: var(--muted); font-size: 13px; }
.info-toggle {
  border: 0; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 15px; line-height: 1; padding: 0 4px;
}
.info-toggle.on { color: var(--yellow); }

/* Segmentierte Auswahl (KetoCal) */
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: 100%; }
.segmented button {
  flex: 1; border: 0; background: #fff; color: var(--ink); padding: 9px 8px;
  cursor: pointer; font-size: 14px; border-right: 1px solid var(--line);
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { background: var(--bg); }
.segmented button.active { background: var(--brand); color: #fff; font-weight: 600; }

/* Eigenes Rezept (Composer) */
.compose-launch { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.compose-rows { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.compose-row { display: flex; align-items: center; gap: 8px; }
.compose-row .food-select { flex: 1; min-width: 0; }
.compose-row .compose-grams { width: 90px; flex: 0 0 auto; }
.compose-row .unit { color: var(--muted); font-size: 14px; }
.compose-fat { margin: 14px 0 4px; }
.compose-fat > label { display: block; margin-bottom: 6px; }
.compose-fat .btn.secondary { margin-top: 4px; }
#compose-content .title { font-weight: 700; font-size: 20px; padding-right: 40px; }
#compose-content .meta { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }

/* Schnellfilter-Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--ink);
}
.chip:hover { background: var(--bg); }
.chip.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
/* Diätologie: eigener, kombinierbarer Schalter – optisch abgesetzt */
.chip.quelle-chip { margin-left: auto; }
.chip.quelle-chip.active { background: #6d28d9; border-color: #6d28d9; color: #fff; }

/* Portions-Umschalter im Detail */
.seg-portion { margin: 0 0 14px; }
.segmented.mini { display: inline-flex; width: auto; }
.segmented.mini button { padding: 7px 14px; font-size: 13px; flex: 0 0 auto; }

/* Fleisch-Tausch im Rezept */
.meat-swap { margin: 0 0 16px; padding: 12px 14px; background: var(--green-bg); border-radius: 9px; }
.meat-swap .seg-label { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.meat-swap .segmented.mini { display: flex; width: 100%; }
.meat-swap .segmented.mini button { flex: 1; padding: 8px 6px; }
.meat-swap .segmented.mini button .mg { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; }
.meat-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.badge.meat { background: #f0e7da; color: #8a5a1c; }

.toolbar .sort-label { margin: 0 0 0 auto; color: var(--muted); font-size: 14px; }
.toolbar #sort-select { max-width: 220px; }
.group-head {
  font-size: 16px; font-weight: 700; color: var(--brand-dark);
  margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--brand-soft);
  display: flex; align-items: center; gap: 8px;
}
.group-head:first-child { margin-top: 4px; }
.group-count {
  font-size: 12px; font-weight: 700; color: var(--muted);
  background: var(--bg); border-radius: 999px; padding: 1px 9px;
}

/* Rezept-Kacheln (Übersicht) */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
  transition: border-color .12s, box-shadow .12s, transform .06s;
}
.tile:hover { border-color: var(--brand); box-shadow: 0 4px 12px rgba(16,24,40,.12); transform: translateY(-1px); }
.tile:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.tile-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tile-icon { font-size: 34px; line-height: 1; }
.favbtn {
  border: 0; background: transparent; cursor: pointer; font-size: 22px; line-height: 1;
  color: var(--muted); padding: 0 2px;
}
.favbtn.on { color: #e2b007; }
.favbtn:hover { color: #e2b007; }
.badge.custom { background: #e6effb; color: var(--accent); }
.badge.quelle { background: #ede9fe; color: #6d28d9; }
.compose-save { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.compose-save input { flex: 1; min-width: 160px; }
.tile-name { font-weight: 700; font-size: 16px; line-height: 1.3; }
.tile-badge { margin-top: -2px; }
.tile-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.tile-stats .prot-ok { color: var(--green); }
.tile-stats .prot-low { color: var(--yellow); }
.tile-cta { margin-top: auto; color: var(--brand-dark); font-size: 13px; font-weight: 600; }

/* Detail-Overlay */
.overlay {
  position: fixed; inset: 0; background: rgba(16,24,40,.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto; z-index: 100;
}
.overlay[hidden] { display: none; }
.overlay-card {
  position: relative; background: var(--panel); border-radius: 14px;
  width: 100%; max-width: 720px; padding: 24px; box-shadow: 0 12px 40px rgba(16,24,40,.3);
}
.overlay-close {
  position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
  border: 0; border-radius: 8px; background: var(--bg); cursor: pointer; font-size: 16px; color: var(--ink);
}
.overlay-close:hover { background: var(--line); }
body.modal-open { overflow: hidden; }
.detail-head { display: flex; align-items: flex-start; gap: 14px; padding-right: 40px; margin-bottom: 14px; }
.detail-icon { font-size: 40px; line-height: 1; }
#detail-content .title { font-weight: 700; font-size: 20px; }
#detail-content .meta { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.detail-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.dstat { background: var(--bg); border-radius: 10px; padding: 12px; text-align: center; }
.dstat .v { font-size: 18px; font-weight: 700; color: var(--brand-dark); }
.dstat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dstat.warn { background: var(--yellow-bg); }
.dstat.warn .v { color: var(--yellow); }
@media (max-width: 560px) { .detail-tiles { grid-template-columns: 1fr 1fr; } }

.badge.keto { background: var(--yellow-bg); color: var(--yellow); }
.badge.noketo { background: var(--green-bg); color: var(--green); }
.prep {
  background: var(--bg); border-radius: 9px; padding: 12px 14px;
  font-size: 14px; color: var(--ink); margin-top: 12px; line-height: 1.55;
}
.prep.thermomix { background: #eef4fb; }
.prep strong { color: var(--brand-dark); }
.prep.thermomix strong { color: var(--accent); }
.diet-note {
  background: var(--yellow-bg); color: var(--yellow);
  border-radius: 9px; padding: 12px 14px; font-size: 14px; line-height: 1.5;
  margin: 0 0 16px;
}
.diet-note strong { color: var(--yellow); }
.adjust-note { color: var(--yellow); font-size: 13px; margin-top: 8px; }
.adjust-note:empty { display: none; }
tr.fatrow td { background: #fdf6e3; }

label.inline { display: inline; margin: 0; color: var(--ink); font-size: 14px; }

@media (max-width: 820px) {
  .settings-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  .settings-grid { grid-template-columns: 1fr; }
  .segmented button { padding: 9px 4px; font-size: 13px; }
}

.badge {
  display: inline-block; vertical-align: middle;
  background: var(--brand-soft); color: var(--brand-dark);
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 999px; margin-left: 6px;
}
.badge.keto { background: var(--yellow-bg); color: var(--yellow); }
.badge.noketo { background: var(--green-bg); color: var(--green); }
.badge.adj { background: #e6effb; color: var(--accent); }
.adjust {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  background: var(--bg); border-radius: 9px; padding: 12px 14px; margin-top: 12px;
}
.adjust-field { display: flex; align-items: center; gap: 8px; }
.adjust-field input[type=number] { width: 110px; }
.adjust-note { color: var(--yellow); font-size: 13px; margin-top: 8px; min-height: 0; }
.adjust-note:empty { display: none; }
tr.fatrow td { background: #fdf6e3; }
.meta-sub { color: var(--accent); font-size: 13px; margin: 2px 0 6px; }
.prep {
  background: var(--bg); border-radius: 9px; padding: 12px 14px;
  font-size: 14px; color: var(--ink); margin-top: 12px; line-height: 1.55;
}
.prep strong { color: var(--brand-dark); }
.checkrow { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.checkrow input[type=checkbox] { width: 18px; height: 18px; }
label.inline { display: inline; margin: 0; color: var(--ink); font-size: 14px; }
#recipe-list h2, #saved-list h2 { margin-top: 8px; }

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🥑</span> HamHam Keto</div>
    <div class="topbar-actions">
      <button id="settings-toggle" class="iconbtn" type="button" aria-expanded="false" aria-controls="settings-grid" title="Einstellungen ein-/ausblenden">⚙️ <span class="lbl">Einstellungen</span></button>
      <button id="compose-btn" class="iconbtn primary" type="button" title="Eigenes Rezept zusammenstellen">🧪 <span class="lbl">Eigenes Rezept</span></button>
    </div>
  </header>

  <main class="main">
    <div class="summary-bar">
      <div class="permeal" id="permeal"></div>
    </div>

    <div class="card settings-grid" id="settings-grid" hidden>
        <div>
          <label>Kalorien pro Tag</label>
          <input id="set-kcal" type="number" min="0" step="10" inputmode="numeric" />
        </div>
        <div>
          <label>Anzahl Mahlzeiten pro Tag</label>
          <input id="set-mahlzeiten" type="number" min="1" max="12" step="1" inputmode="numeric" />
        </div>
        <div>
          <label>Verhältnis (z. B. 1,8 für 1,8:1)</label>
          <input id="set-ratio" type="number" min="0" step="0.1" inputmode="decimal" />
        </div>
        <div>
          <label>Körpergewicht (kg)</label>
          <input id="set-weight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="optional" />
        </div>
        <div>
          <label>Eiweiß-Bedarf</label>
          <select id="set-proteinmode">
            <option value="0">manuell eingeben</option>
            <option value="1">1,0 g/kg/Tag</option>
            <option value="1.2">1,2 g/kg/Tag</option>
            <option value="1.5">1,5 g/kg/Tag</option>
            <option value="2">2,0 g/kg/Tag</option>
          </select>
        </div>
        <div>
          <label>Eiweiß pro Tag (g)</label>
          <input id="set-eiweiss" type="number" min="0" step="1" inputmode="numeric" />
        </div>
    </div>

    <div id="info-note" hidden></div>

    <div class="filter-sort">
      <div id="filter-bar"></div>
      <div class="toolbar">
        <span class="hint" id="recipe-count"></span>
        <label for="sort-select" class="sort-label">Sortieren:</label>
        <select id="sort-select">
          <option value="kategorie">Nach Kategorie</option>
          <option value="name">Name (A–Z)</option>
          <option value="eiweiss">Eiweiß (meiste zuerst)</option>
        </select>
      </div>

  <script>
/* HamHam Keto — Logik
   Eine Seite: Einstellungen + Standard-Rezepte, die automatisch auf das
   Verhältnis und die Kalorien pro Mahlzeit umgerechnet werden.
   Einstellungen werden lokal im Browser gespeichert (localStorage). */

(function () {
  "use strict";

  const STORAGE_KEY = "ketoplaner.v5";

  /* ---------- State ---------- */
  function defaultState() {
    return {
      settings: { kcal: 700, ratio: 1.8, mahlzeiten: 5, eiweiss: 20, weight: 8, proteinPerKg: 1.5, ketocal: "ohne", filter: "alle", onlyQuelle: false, sort: "kategorie" },
      compose: { items: [{ food: "", grams: 60 }], fats: [{ food: "Schlagobers NÖM", share: 100 }], scale: true },
      favorites: [],
      savedRecipes: [],
    };
  }
  let state = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const p = JSON.parse(raw), d = defaultState();
      return {
        settings: Object.assign(d.settings, p.settings || {}),
        compose: Object.assign(d.compose, p.compose || {}),
        favorites: p.favorites || [],
        savedRecipes: p.savedRecipes || [],
      };
    } catch (e) { return defaultState(); }
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------- Helpers ---------- */
  function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
  function round1(v) { return Math.round(v * 10) / 10; }
  function fmt(v, dec) {
    if (v === "" || v === null || v === undefined || !isFinite(v)) return "—";
    const d = dec === undefined ? 1 : dec;
    return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d))
      .toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- Lebensmittel (nur intern für die Berechnung) ---------- */
  let foodIndex = {};
  function rebuildFoodIndex() { foodIndex = {}; FOODS_DEFAULT.forEach(f => { foodIndex[f.name] = f; }); }
  function lookup(name) { return foodIndex[name] || null; }

  function lineMacros(item) {
    const f = lookup(item.food);
    if (!f || item.grams === "" || item.grams === null) return { eiweiss: 0, fett: 0, kh: 0, kcal: 0, valid: false };
    const g = num(item.grams);
    const eiweiss = f.eiweiss * g / 100, fett = f.fett * g / 100, kh = f.kh * g / 100;
    return { eiweiss, fett, kh, kcal: eiweiss * 4 + fett * 9 + kh * 4, valid: true };
  }
  function sumMacros(items) {
    return items.reduce((a, it) => {
      const m = lineMacros(it);
      a.eiweiss += m.eiweiss; a.fett += m.fett; a.kh += m.kh; a.kcal += m.kcal; return a;
    }, { eiweiss: 0, fett: 0, kh: 0, kcal: 0 });
  }
  function ratioOf(m) { const d = m.eiweiss + m.kh; return d ? m.fett / d : null; }
  function ratioClass(actual, target) {
    if (actual === null || !isFinite(actual) || target === 0) return "idle";
    const dev = Math.abs(actual - target) / target;
    if (dev <= 0.05) return "ok"; if (dev <= 0.15) return "warn"; return "bad";
  }
  // Ungefähres Volumen in ml (Fett ~0,92 g/ml, sonst ~1,0 g/ml)
  function volumeMl(items) {
    return items.reduce((a, it) => {
      const f = lookup(it.food); const g = num(it.grams);
      return a + g / ((f && f.fett >= 50) ? 0.92 : 1.0);
    }, 0);
  }

  /* ---------- Schnellfilter ---------- */
  const FILTERS = [
    { id: "alle", label: "Alle" },
    { id: "fleisch", label: "🥩 Fleisch" },
    { id: "fisch", label: "🐟 Fisch" },
    { id: "vegetarisch", label: "🥦 Vegetarisch" },
    { id: "obst", label: "🍓 Obst" },
  ];
  function recipeTags(rec) {
    let fleisch = false, fisch = false, obst = false;
    rec.items.forEach(it => {
      const f = lookup(it.food); if (!f) return;
      const k = f.kategorie;
      if (k === "Fleisch" || k === "Wurst") fleisch = true;
      if (k === "Fisch") fisch = true;
      if (k === "Obst") obst = true;
    });
    return { fleisch, fisch, obst, veg: !fleisch && !fisch };
  }
  function matchesFilter(rec, filter) {
    const t = recipeTags(rec);
    switch (filter) {
      case "fleisch": return t.fleisch;
      case "fisch": return t.fisch;
      case "vegetarisch": return t.veg;
      case "obst": return t.obst;
      default: return true;
    }
  }

  /* ---------- Abgeleitete Werte ---------- */
  function derived() {
    const s = state.settings;
    const kcal = num(s.kcal), ratio = num(s.ratio);
    const mahl = Math.max(1, num(s.mahlzeiten) || 1);
    const perKg = num(s.proteinPerKg), weight = num(s.weight);
    const autoProtein = perKg > 0 && weight > 0;
    const eiweiss = autoProtein ? Math.round(weight * perKg) : num(s.eiweiss);
    return { kcal, ratio, mahl, eiweiss, autoProtein, kcalMahl: kcal / mahl, eiweissMahl: eiweiss / mahl };
  }

  /* ---------- Rezept-Anpassung ---------- */
  // Stell-Zutat zum Ausgleich = am stärksten fettdominante Zutat
  // (höchstes Fett/(Eiweiß+KH)). Erkennt Butter/Öl wie auch Sahne/Streichgenuss.
  function fatItemIndex(items) {
    let idx = -1, best = -1;
    items.forEach((it, i) => {
      const f = lookup(it.food); if (!f || f.fett <= 0) return;
      const denom = f.eiweiss + f.kh;
      const rr = denom > 0 ? f.fett / denom : Infinity;
      if (rr > best) { best = rr; idx = i; }
    });
    return idx;
  }
  // Rechnet Rezept auf Ziel-Verhältnis + Ziel-Kalorien um.
  function computeAdjustedRecipe(rec, targetKcal, ratio) {
    const base = rec.items.map(it => ({ food: it.food, grams: num(it.grams) }));
    const baseSum = sumMacros(base);
    const T = (targetKcal && targetKcal > 0) ? targetKcal : baseSum.kcal;
    const fi = fatItemIndex(base);
    if (fi < 0) {
      const s = baseSum.kcal > 0 ? T / baseSum.kcal : 1;
      const items = base.map(it => ({ food: it.food, grams: round1(it.grams * s) }));
      const sum = sumMacros(items);
      return { items, ratio: ratioOf(sum), kcal: sum.kcal, ok: false, fatIndex: -1 };
    }
    const fat = lookup(base[fi].food);
    let Pn = 0, Fn = 0, Cn = 0;
    base.forEach((it, i) => {
      if (i === fi) return;
      const f = lookup(it.food); if (!f) return;
      Pn += f.eiweiss * it.grams / 100; Fn += f.fett * it.grams / 100; Cn += f.kh * it.grams / 100;
    });
    const fp = fat.eiweiss, ff = fat.fett, fc = fat.kh;
    const A = Fn - ratio * (Pn + Cn);
    const B = (ff - ratio * (fp + fc)) / 100;
    const Kn = 4 * Pn + 9 * Fn + 4 * Cn;
    const kf = 4 * fp + 9 * ff + 4 * fc;
    let x, s;
    if (Math.abs(A) < 1e-9) { x = 0; s = Kn > 0 ? T / Kn : 1; }
    else {
      const denom = kf / 100 - B * Kn / A;
      if (Math.abs(denom) < 1e-9) return { items: base, ratio: ratioOf(baseSum), kcal: baseSum.kcal, ok: false, fatIndex: fi };
      x = T / denom; s = -x * B / A;
    }
    if (x < 0 || s <= 0) return { items: base, ratio: ratioOf(baseSum), kcal: baseSum.kcal, ok: false, fatIndex: fi };
    const items = base.map((it, i) => i === fi
      ? { food: it.food, grams: round1(x) }
      : { food: it.food, grams: round1(it.grams * s) });
    const sum = sumMacros(items);
    return { items, ratio: ratioOf(sum), kcal: sum.kcal, ok: true, fatIndex: fi };
  }
  // Fleisch-Tausch: alle anderen Zutaten (Gemüse, Wasser, Öl/Fett) bleiben fix;
  // nur die Fleischmenge wird so berechnet, dass das Verhältnis exakt stimmt.
  // (Kalorien dürfen sich dabei leicht ändern.)
  function solveMeatForRatio(items, mi, ratio) {
    let F = 0, PC = 0;
    items.forEach((it, i) => {
      if (i === mi) return; const f = lookup(it.food); if (!f) return;
      const g = num(it.grams); F += f.fett * g / 100; PC += (f.eiweiss + f.kh) * g / 100;
    });
    const mf = lookup(items[mi].food); if (!mf) return null;
    const denom = mf.fett / 100 - ratio * (mf.eiweiss + mf.kh) / 100;
    if (Math.abs(denom) < 1e-9) return null;
    const m = (ratio * PC - F) / denom;
    if (!(m > 0)) return null;
    return items.map((it, i) => i === mi
      ? { food: it.food, grams: round1(m) }

  }

  /* ---------- Fleisch-Tausch ----------

     Faktoren relativ zu Huhn. Die Fleischmenge eines Rezepts wird in

  const MEATS = {
    huhn: { food: "Hühnerbrust ohne Haut", factor: 1.0, label: "Huhn", icon: "🍗", word: "Hendl" },
    rind: { food: "Rindfleisch (mager)", factor: 1.5, label: "Rind", icon: "🥩", word: "Rindfleisch" },
    pute: { food: "Putenbrust ohne Haut", factor: 0.9, label: "Pute", icon: "🦃", word: "Putenfleisch" },
  };
  // Fleisch-Wörter in den Zubereitungstexten, die beim Tausch angepasst werden.
  const MEAT_WORDS_RE = /Rinderfaschiertes|Rinder-Faschiertes|Hühnerfleisch|Hühnerbrust|Putenfleisch|Putenbrust|Faschiertes|Rindfleisch|Hendl|Hühnchen|Pute|Huhn|Rind/g;
  function meatKeyOfFood(name) { for (const k in MEATS) if (MEATS[k].food === name) return k; return null; }
  function recipeMeatSlot(rec) {
    for (let i = 0; i < rec.items.length; i++) {
      const k = meatKeyOfFood(rec.items[i].food);
      if (k) return { index: i, baseKey: k, baseGrams: num(rec.items[i].grams) };
    }

  }
  function meatGramsFor(slot, key) {
    const chickenEquiv = slot.baseGrams / MEATS[slot.baseKey].factor;
    return round1(chickenEquiv * MEATS[key].factor);
  }
  // Tausch ist nur temporär (gilt für das gerade geöffnete Rezept, nichts wird gespeichert).
  function applyMeatChoice(rec, choice) {
    const slot = recipeMeatSlot(rec); if (!slot) return rec;
    if (!choice || choice === slot.baseKey) return rec;
    const grams = meatGramsFor(slot, choice);
    const items = rec.items.map((it, i) => i === slot.index ? { food: MEATS[choice].food, grams: grams } : it);
    return Object.assign({}, rec, { items: items });
  }
  function adaptPrep(text, rec, choice) {
    if (!text) return text;
    const slot = recipeMeatSlot(rec); if (!slot) return text;

  /* ---------- Favoriten & Rezeptquellen ---------- */
  function hasKetoCal(items) { return items.some(it => (it.food || "").toLowerCase().indexOf("ketocal") !== -1); }

  function isFav(rec) { return state.favorites.indexOf(recipeKey(rec)) !== -1; }
  function toggleFav(rec) {
    const k = recipeKey(rec), i = state.favorites.indexOf(k);

  }
  // Alle Rezepte: zuerst eigene, dann Standard; ketocal/Tags abgeleitet
  function allRecipes() {
    const saved = state.savedRecipes.map(sr => ({
      custom: true, key: sr.key, name: sr.name, icon: sr.icon || "📝",

      thermomix: sr.thermomix || "Zutaten vorbereiten, gemeinsam fein pürieren und das Fett glatt unterrühren.",

  /* ---------- Rezepte rendern ---------- */

  function renderRezepte() {

    // Schnellfilter-Chips

    const keto = s.ketocal || "ohne";
    const fb = $("filter-bar");
    fb.innerHTML = "";
    // KetoCal-Auswahl (entweder/oder)
    const ketoRow = el("div", { class: "chips" });
    [["ohne", "Ohne KetoCal"], ["mit", "Mit KetoCal"], ["alle", "Mit & ohne"]].forEach(([val, label]) => {
      const c = el("button", { class: "chip keto-chip" + (val === keto ? " active" : "") }, label);
      c.addEventListener("click", () => { state.settings.ketocal = val; save(); renderRezepte(); });
      ketoRow.appendChild(c);
    });
    fb.appendChild(ketoRow);

    const chips = el("div", { class: "chips" });
    FILTERS.forEach(f => {
      const chip = el("button", { class: "chip" + (f.id === filter ? " active" : "") }, f.label);
      chip.addEventListener("click", () => { state.settings.filter = f.id; save(); renderRezepte(); });
      chips.appendChild(chip);
    });

    const qChip = el("button", { class: "chip quelle-chip" + (onlyQuelle ? " active" : "") }, "👩‍⚕️ Diätologie");

    $("info-note").hidden = !(warn && infoOpen);

      recipes.length + " Rezept" + (recipes.length === 1 ? "" : "e") +

      appendGroup("⭐ Favoriten", favs);

        ? x => -sumMacros(x.res.items).eiweiss
        : x => x.rec.name.toLowerCase();
      const sorted = recipes.slice().sort((a, b) => {
        const fa = isFav(a.rec) ? 0 : 1, fb = isFav(b.rec) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        const ka = keyFn(a), kb = keyFn(b);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
      const grid = el("div", { class: "tiles" });
      sorted.forEach(x => grid.appendChild(renderRecipeTile(x.rec, x.res, d)));
      list.appendChild(grid);
    }
  }

  // Berechnet die Gesamtmenge der (ggf. mehreren) Ausgleichsfette, damit das
  // Verhältnis bei fixen Basismengen stimmt. Die Fette werden gemäß ihren
  // Anteilen (share) aufgeteilt.
  function computeFreeMeal(baseItems, fats, ratio) {
    let Pb = 0, Fb = 0, Cb = 0, hasBase = false;
    baseItems.forEach(it => {
      const f = lookup(it.food); const g = num(it.grams);
      if (!f || g <= 0) return; hasBase = true;
      Pb += f.eiweiss * g / 100; Fb += f.fett * g / 100; Cb += f.kh * g / 100;
    });
    if (!hasBase) return { ok: false, note: "Bitte mindestens ein Lebensmittel wählen." };

    // gültige Fette mit Anteil
    const valid = (fats || []).filter(x => lookup(x.food) && num(x.share) > 0);
    if (!valid.length) return { ok: false, note: "Bitte mindestens ein Fett zum Ausgleich wählen." };
    const totShare = valid.reduce((a, x) => a + num(x.share), 0);
    const w = valid.map(x => num(x.share) / totShare);
    // gemischte Nährwerte pro 100 g
    let bp = 0, bf = 0, bc = 0;
    valid.forEach((x, i) => { const f = lookup(x.food); bp += w[i] * f.eiweiss; bf += w[i] * f.fett; bc += w[i] * f.kh; });
    const denom = bf - ratio * (bp + bc);
    if (denom <= 0) return { ok: false, note: "Das gewählte Fett ist nicht fettreich genug für das Verhältnis. Bitte ein fettreicheres Fett wählen (z. B. Butter oder Öl)." };
    const xTot = 100 * (ratio * (Pb + Cb) - Fb) / denom;
    if (xTot < 0) return { ok: false, note: "Die gewählten Zutaten sind bereits zu fettreich für dieses Verhältnis. Bitte fettärmere Zutaten verwenden." };

    const items = baseItems.filter(it => lookup(it.food) && num(it.grams) > 0)
      .map(it => ({ food: it.food, grams: round1(num(it.grams)) }));
    valid.forEach((x, i) => items.push({ food: x.food, grams: round1(w[i] * xTot), isFat: true }));
    return { ok: true, items };
  }

        const row = el("div", { class: "compose-row" });
        const sel = el("select", { class: "food-select" });
        FAT_OPTIONS.forEach(n => { const o = el("option", { value: n }, n); if (n === ft.food) o.selected = true; sel.appendChild(o); });
        sel.value = ft.food;
        sel.addEventListener("change", () => { ft.food = sel.value; recompute(); });
        row.appendChild(sel);
        if (multi) {
          const sh = el("input", { type: "number", min: "0", step: "5", value: ft.share, class: "compose-grams" });
          sh.addEventListener("input", e => { ft.share = e.target.value; recompute(); });
          row.appendChild(sh);
          row.appendChild(el("span", { class: "unit" }, "%"));
          const del = el("button", { class: "btn ghost", title: "Entfernen" }, "✕");
          del.addEventListener("click", () => { compose.fats.splice(i, 1); renderFats(); recompute(); });
          row.appendChild(del);
        }
        fatsWrap.appendChild(row);
      });
    }

    const scaleRow = el("div", { class: "checkrow" });
    const cb = el("input", { type: "checkbox", id: "compose-scale" }); cb.checked = compose.scale;
    cb.addEventListener("change", () => { compose.scale = cb.checked; recompute(); });
    const lbl = el("label", { for: "compose-scale", class: "inline" }, "Mengen automatisch für eine Mahlzeit (≈" + fmt(d.kcalMahl, 0) + " kcal) berechnen");
    scaleRow.appendChild(cb); scaleRow.appendChild(lbl);
    c.appendChild(scaleRow);

    const result = el("div", { id: "compose-result" });
    c.appendChild(result);

    // Speichern als eigenes Rezept
    let lastItems = [], lastOk = false;
    const saveBox = el("div", { class: "compose-save" });
    const nameInp = el("input", { type: "text", placeholder: "Name für dein Rezept", value: compose.fromRecipe || "" });
    const saveBtn = el("button", { class: "btn" }, compose.editKey ? "Änderungen speichern" : "💾 Als eigenes Rezept speichern");
    saveBtn.addEventListener("click", () => {
      const nm = nameInp.value.trim();
      if (!nm) { alert("Bitte einen Namen für das Rezept eingeben."); return; }
      if (!lastOk || !lastItems.length) { alert("Bitte zuerst gültige Zutaten und ein Fett wählen."); return; }
      const items = lastItems.map(it => ({ food: it.food, grams: it.grams }));
      if (compose.editKey) {
        const sr = state.savedRecipes.find(s => s.key === compose.editKey);
        if (sr) { sr.name = nm; sr.items = items; }
      } else {
        const key = "custom:" + Date.now();
        state.savedRecipes.unshift({ key, name: nm, icon: "📝", items });
        compose.editKey = key; compose.fromRecipe = nm;
      }
      save();
      saveBtn.textContent = "✓ Gespeichert"; setTimeout(() => { saveBtn.textContent = "Änderungen speichern"; }, 1500);
    });
    saveBox.appendChild(nameInp); saveBox.appendChild(saveBtn);
    c.appendChild(saveBox);

    function renderRows() {
      rowsWrap.innerHTML = "";
      compose.items.forEach((it, i) => {
        const row = el("div", { class: "compose-row" });
        row.appendChild(buildFoodSelect(it.food, v => { it.food = v; recompute(); }));
        const g = el("input", { type: "number", min: "0", step: "5", value: it.grams, class: "compose-grams" });
        g.addEventListener("input", e => { it.grams = e.target.value; recompute(); });
        row.appendChild(g);
        row.appendChild(el("span", { class: "unit" }, "g"));
        const del = el("button", { class: "btn ghost", title: "Entfernen" }, "✕");
        del.addEventListener("click", () => { compose.items.splice(i, 1); if (!compose.items.length) compose.items.push({ food: "", grams: 30 }); renderRows(); recompute(); });
        row.appendChild(del);
        rowsWrap.appendChild(row);
      });
    }
    function recompute() {
      save();
      const d = derived();
      const res = computeFreeMeal(compose.items, compose.fats, d.ratio);
      const box = document.getElementById("compose-result");
      if (!res.ok) { lastOk = false; lastItems = []; box.innerHTML = '<div class="adjust-note">⚠️ ' + res.note + "</div>"; return; }
      let items = res.items;
      let sum = sumMacros(items);
      if (compose.scale && sum.kcal > 0) {
        const factor = d.kcalMahl / sum.kcal;
        items = items.map(it => ({ food: it.food, grams: round1(num(it.grams) * factor), isFat: it.isFat }));
        sum = sumMacros(items);
      }
      lastOk = true; lastItems = items;
      const r = ratioOf(sum);
      const totalG = items.reduce((a, it) => a + num(it.grams), 0);
      const ml = volumeMl(items);
      const proteinOk = sum.eiweiss >= d.eiweissMahl * 0.9;
      let rows = "";
      items.forEach(it => {
        const m = lineMacros(it);
        rows += "<tr" + (it.isFat ? ' class="fatrow"' : "") + "><td class='name'>" + escapeHtml(it.food) +
          (it.isFat ? " ⟵ Fett (berechnet)" : "") + "</td><td>" + fmt(it.grams, 1) +
          "</td><td>" + fmt(m.eiweiss) + "</td><td>" + fmt(m.fett) + "</td><td>" + fmt(m.kh) + "</td><td>" + fmt(m.kcal, 0) + "</td></tr>";
      });
      box.innerHTML =
        '<div class="detail-tiles">' +
          '<div class="dstat"><div class="v">' + fmt(sum.kcal, 0) + '</div><div class="l">kcal</div></div>' +
          '<div class="dstat"><div class="v"><span class="ratio-pill ' + ratioClass(r, d.ratio) + '">' + (r === null ? "—" : fmt(r, 2)) + ':1</span></div><div class="l">Verhältnis</div></div>' +
          '<div class="dstat"><div class="v">≈ ' + fmt(totalG, 0) + ' g</div><div class="l">Menge (' + fmt(ml, 0) + ' ml)</div></div>' +
          '<div class="dstat ' + (proteinOk ? "" : "warn") + '"><div class="v">' + fmt(sum.eiweiss) + ' g</div><div class="l">Eiweiß (Ziel ' + fmt(d.eiweissMahl) + ' g)</div></div>' +
        "</div>" +
        '<div class="tbl-wrap"><table><thead><tr><th>Lebensmittel</th><th>Gramm</th><th>Eiweiß</th><th>Fett</th><th>KH</th><th>Kcal</th></tr></thead><tbody>' +
        rows +
        "<tr class='sum'><td class='name'>Summe</td><td>" + fmt(totalG, 0) + "</td><td>" + fmt(sum.eiweiss) + "</td><td>" +
        fmt(sum.fett) + "</td><td>" + fmt(sum.kh) + "</td><td>" + fmt(sum.kcal, 0) + "</td></tr>" +
        "</tbody></table></div>";
      const pr = el("div", { class: "btn-row" });
      const pb = el("button", { class: "btn secondary" }, "🖨️ Drucken");
      const recForPrint = { name: "Eigenes Rezept", icon: "🧪", ketocal: false,
        thermomix: "Zutaten garen bzw. vorbereiten, gemeinsam fein pürieren und das Fett glatt unterrühren.",
        zubereitung: "Zutaten vorbereiten, fein pürieren und das berechnete Fett untermischen." };
      pb.addEventListener("click", () => printRecipe(recForPrint, { items }, d, 1));
      pr.appendChild(pb); box.appendChild(pr);
    }

    renderRows(); renderFats(); recompute();
    document.getElementById("compose-overlay").hidden = false;
    document.body.classList.add("modal-open");
  }
  function closeCompose() {
    document.getElementById("compose-overlay").hidden = true;
    document.body.classList.remove("modal-open");
    renderRezepte();
  }
  function bindCompose() {
    document.getElementById("compose-btn").addEventListener("click", openCompose);
    document.getElementById("compose-close").addEventListener("click", closeCompose);
    const ov = document.getElementById("compose-overlay");
    ov.addEventListener("click", e => { if (e.target === ov) closeCompose(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closeCompose(); });
  }

  /* ---------- Init ---------- */
  function init() {
    rebuildFoodIndex();
    bindSettingsBar();
    bindDetail();
    bindCompose();
    renderRezepte();
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
