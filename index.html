<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f855a" />
  <title>HamHam Keto</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HamHam Keto" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=32cf160f" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-img" src="icon-192.png" alt="HamHam Keto Logo" /><span class="brand-name">HamHam Keto</span></div>
    <div class="topbar-actions">
      <button id="settings-toggle" class="iconbtn" type="button" aria-expanded="false" aria-controls="settings-grid" title="Einstellungen ein-/ausblenden">⚙️ <span class="lbl">Einstellungen</span></button>
      <button id="compose-btn" class="iconbtn primary" type="button" title="Eigenes Rezept zusammenstellen">🧪 <span class="lbl">Eigenes Rezept</span></button>
    </div>
  </header>

  <main class="main">
    <div class="summary-bar">
      <div class="permeal" id="permeal"></div>
    </div>

    <div class="card settings-grid" id="settings-grid" hidden>
        <div>
          <label>Kalorien pro Tag</label>
          <input id="set-kcal" type="number" min="0" step="10" inputmode="numeric" />
        </div>
        <div>
          <label>Anzahl Mahlzeiten pro Tag</label>
          <input id="set-mahlzeiten" type="number" min="1" max="12" step="1" inputmode="numeric" />
        </div>
        <div>
          <label>Verhältnis (z. B. 1,8 für 1,8:1)</label>
          <input id="set-ratio" type="number" min="0" step="0.1" inputmode="decimal" />
        </div>
        <div>
          <label>Körpergewicht (kg)</label>
          <input id="set-weight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="optional" />
        </div>
        <div>
          <label>Eiweiß-Bedarf</label>
          <select id="set-proteinmode">
            <option value="0">manuell eingeben</option>
            <option value="1">1,0 g/kg/Tag</option>
            <option value="1.2">1,2 g/kg/Tag</option>
            <option value="1.5">1,5 g/kg/Tag</option>
            <option value="2">2,0 g/kg/Tag</option>
          </select>
        </div>
        <div>
          <label>Eiweiß pro Tag (g)</label>
          <input id="set-eiweiss" type="number" min="0" step="1" inputmode="numeric" />
        </div>
    </div>

    <div id="info-note" hidden></div>

    <div class="filter-sort">
      <div id="filter-bar"></div>
      <div class="toolbar">
        <span class="hint" id="recipe-count"></span>
        <span class="sort-wrap">
          <label for="sort-select" class="sort-label">Sortieren:</label>
          <select id="sort-select">
            <option value="kategorie">Nach Kategorie</option>
            <option value="name">Name (A–Z)</option>
            <option value="eiweiss">Eiweiß (meiste zuerst)</option>
            <option value="volumen">Menge (wenig zuerst)</option>
          </select>
        </span>
      </div>
    </div>
    <div id="recipe-list"></div>

    <p class="footnote">Alle Eingaben werden nur lokal in deinem Browser gespeichert. Dieses Werkzeug ersetzt keine ärztliche oder diätologische Beratung – die ketogene Ernährung über Sonde bitte nur mit dem Behandlungsteam abstimmen und die Mengen fachlich prüfen lassen.</p>
  </main>

  <!-- Eigenes Rezept zusammenstellen -->
  <div id="compose-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <button class="overlay-close" id="compose-close" aria-label="Schließen">✕</button>
      <div id="compose-content"></div>
    </div>
  </div>

  <!-- Detail-Ansicht eines Rezepts -->
  <div id="detail-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <button class="overlay-close" id="detail-close" aria-label="Schließen">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="foods.js?v=929cdbe0"></script>
  <script src="recipes.js?v=ad37e8e9"></script>
  <script src="app.js?v=7b9ae853"></script>
</body>
</html>
